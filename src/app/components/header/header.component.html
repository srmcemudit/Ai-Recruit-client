<header class="h-20 bg-slate-900/80 backdrop-blur-xl border-b border-slate-800/80 px-8 flex items-center justify-between sticky top-0 z-20">
  <!-- Search & Quick Filters -->
  <div class="flex items-center gap-4 flex-1 max-w-xl">
    <div class="relative w-full">
      <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      <input
        type="text"
        [ngModel]="recruitService.searchQuery()"
        (ngModelChange)="recruitService.setSearchQuery($event)"
        placeholder="Search candidates, roles, skills (e.g. PyTorch, Angular, Design)..."
        class="w-full bg-slate-800/80 text-sm text-slate-200 placeholder-slate-400 pl-10 pr-20 py-2.5 rounded-xl border border-slate-700/60 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all shadow-inner"
      />
      <div class="absolute right-3 top-1/2 -translate-y-1/2 flex items-center gap-1 text-[11px] font-mono text-slate-400 bg-slate-700/50 px-1.5 py-0.5 rounded border border-slate-600/40">
        <span>⌘K</span>
      </div>
    </div>
  </div>

  <!-- Right Header Actions -->
  <div class="flex items-center gap-3">
    <!-- Live AI Status pill -->
    <div class="hidden lg:flex items-center gap-2 px-3 py-1.5 rounded-full bg-indigo-950/60 border border-indigo-500/30 text-indigo-300 text-xs font-medium shadow-sm">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span>AI Screening: <strong class="text-white">Active (Top {{ topMatchScore() }} Match)</strong></span>
    </div>

    <!-- Date indicator -->
    <div class="hidden md:flex items-center gap-2 text-xs font-medium text-slate-400 bg-slate-800/40 px-3 py-2 rounded-xl border border-slate-700/40">
      <svg class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
      <span>{{ todayFormatted() }}</span>
    </div>

    <!-- Notification Bell -->
    <button class="relative p-2.5 rounded-xl text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 transition-colors border border-transparent hover:border-slate-700/50">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
      </svg>
      <span class="absolute top-2 right-2 w-2 h-2 bg-indigo-500 rounded-full ring-2 ring-slate-900"></span>
    </button>

    <!-- Post Job Button -->
    <button
      (click)="recruitService.openNewJobModal()"
      class="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold border border-slate-700 transition-all shadow-sm"
    >
      <svg class="w-4 h-4 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      <span>Post Job</span>
    </button>

    <!-- Schedule Interview Button -->
    <button
      (click)="recruitService.openScheduleModal()"
      class="flex items-center gap-2 px-4 py-2 rounded-xl bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 text-white text-xs font-semibold shadow-md shadow-indigo-600/25 transition-all"
    >
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
      <span>Schedule Interview</span>
    </button>

    <!-- Recruiter Avatar & Sign Out -->
    <div class="flex items-center gap-2.5 pl-2 border-l border-slate-800/80">
      <div class="relative">
        <img
          [src]="authService.currentUser()?.avatar || 'https://images.unsplash.com/photo-1580489944761-15a19d654956?w=100&auto=format&fit=crop&q=80'"
          [alt]="authService.currentUser()?.name || 'Recruiter'"
          class="w-8 h-8 rounded-full object-cover ring-2 ring-indigo-500/40"
        />
        <span class="absolute bottom-0 right-0 w-2 h-2 rounded-full bg-emerald-400 ring-2 ring-slate-900"></span>
      </div>
      <div class="hidden xl:block text-left">
        <span class="block text-xs font-bold text-white leading-tight truncate max-w-[120px]">{{ authService.currentUser()?.name || 'Elena Rostova' }}</span>
        <span class="block text-[10px] text-slate-400">Recruiter</span>
      </div>
      <button
        (click)="logout()"
        title="Sign Out"
        class="text-slate-400 hover:text-rose-400 p-1.5 rounded-lg hover:bg-slate-800/80 transition-colors"
      >
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
      </button>
    </div>
  </div>
</header>
