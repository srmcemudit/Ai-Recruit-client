<aside class="w-64 bg-slate-900/95 border-r border-slate-800/80 flex flex-col h-screen fixed left-0 top-0 z-30 transition-all duration-300 backdrop-blur-xl">
  <!-- App Brand -->
  <div class="p-6 border-b border-slate-800/80 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/25 ring-1 ring-white/20">
        <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
      </div>
      <div>
        <div class="flex items-center gap-1.5">
          <span class="font-extrabold text-base tracking-tight text-white">AI Recruit</span>
          <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">PRO</span>
        </div>
        <p class="text-xs text-slate-400 font-medium">Smart Talent Platform</p>
      </div>
    </div>
  </div>

  <!-- Navigation links -->
  <div class="flex-1 px-4 py-6 space-y-1.5 overflow-y-auto">
    <div class="text-[11px] font-semibold uppercase tracking-wider text-slate-500 px-3 mb-2">Main Menu</div>

    <!-- Dashboard -->
    <button
      (click)="navigateTo('dashboard')"
      [class]="recruitService.activeSection() === 'dashboard'
        ? 'w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl bg-indigo-600 text-white font-medium shadow-md shadow-indigo-600/20 transition-all'
        : 'w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 font-medium transition-all'"
    >
      <div class="flex items-center gap-3">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        <span class="text-sm">Overview</span>
      </div>
      <span *ngIf="recruitService.activeSection() === 'dashboard'" class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
    </button>

    <!-- Week-wise Calendar Timeline -->
    <button
      (click)="navigateTo('schedule')"
      [class]="recruitService.activeSection() === 'schedule'
        ? 'w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl bg-indigo-600 text-white font-medium shadow-md shadow-indigo-600/20 transition-all'
        : 'w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 font-medium transition-all'"
    >
      <div class="flex items-center gap-3">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        <span class="text-sm">Interview Timeline</span>
      </div>
      <span class="px-2 py-0.5 text-xs font-semibold rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">
        {{ recruitService.scheduledInterviewsCount() }}
      </span>
    </button>

    <!-- Top Candidates -->
    <button
      (click)="navigateTo('candidates')"
      [class]="recruitService.activeSection() === 'candidates'
        ? 'w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl bg-indigo-600 text-white font-medium shadow-md shadow-indigo-600/20 transition-all'
        : 'w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 font-medium transition-all'"
    >
      <div class="flex items-center gap-3">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
        </svg>
        <span class="text-sm">Top Candidates</span>
      </div>
      <span class="px-2 py-0.5 text-xs font-semibold rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
        98% AI
      </span>
    </button>

    <!-- Shortlisted Candidates -->
    <button
      (click)="navigateTo('shortlisted')"
      [class]="recruitService.activeSection() === 'shortlisted'
        ? 'w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl bg-indigo-600 text-white font-medium shadow-md shadow-indigo-600/20 transition-all'
        : 'w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 font-medium transition-all'"
    >
      <div class="flex items-center gap-3">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
        <span class="text-sm">Shortlisted</span>
      </div>
      <span class="px-2 py-0.5 text-xs font-semibold rounded-full bg-indigo-500/20 text-indigo-300">
        {{ recruitService.totalShortlistedCount() }}
      </span>
    </button>

    <!-- Total Job Posts -->
    <button
      (click)="navigateTo('jobs')"
      [class]="recruitService.activeSection() === 'jobs'
        ? 'w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl bg-indigo-600 text-white font-medium shadow-md shadow-indigo-600/20 transition-all'
        : 'w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 font-medium transition-all'"
    >
      <div class="flex items-center gap-3">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>
        <span class="text-sm">Job Postings</span>
      </div>
      <span class="px-2 py-0.5 text-xs font-semibold rounded-full bg-slate-800 text-slate-300 border border-slate-700">
        {{ recruitService.totalJobPostsCount() }}
      </span>
    </button>

    <div class="pt-5 pb-2">
      <div class="text-[11px] font-semibold uppercase tracking-wider text-slate-500 px-3 mb-2">Recruitment AI</div>
      
      <!-- AI Match Engine card -->
      <div class="p-3.5 rounded-2xl bg-gradient-to-b from-indigo-950/40 to-purple-950/20 border border-indigo-500/20 relative overflow-hidden">
        <div class="flex items-center gap-2 mb-2">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
          <span class="text-xs font-bold text-indigo-300">AI Sourcing Agent</span>
        </div>
        <p class="text-[11px] text-slate-400 leading-relaxed mb-3">
          Matched 24 new profiles across GitHub, arXiv, and LinkedIn today.
        </p>
        <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
          <div class="bg-gradient-to-r from-indigo-500 to-purple-500 h-1.5 rounded-full w-[76%]"></div>
        </div>
        <div class="flex justify-between items-center mt-2 text-[10px] text-slate-400">
          <span>Goal: 18/25 Hires</span>
          <span class="font-semibold text-indigo-300">72%</span>
        </div>
      </div>
    </div>
  </div>

  <!-- User Profile footer -->
  <div class="p-4 border-t border-slate-800/80 bg-slate-900/60">
    <div class="flex items-center justify-between p-2 rounded-xl hover:bg-slate-800/60 transition-colors">
      <div class="flex items-center gap-3 overflow-hidden">
        <div class="relative shrink-0">
          <img
            [src]="authService.currentUser()?.avatar || 'https://images.unsplash.com/photo-1580489944761-15a19d654956?w=100&auto=format&fit=crop&q=80'"
            [alt]="authService.currentUser()?.name || 'Recruiter'"
            class="w-9 h-9 rounded-full object-cover ring-2 ring-indigo-500/40"
          />
          <span class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full bg-emerald-400 ring-2 ring-slate-900"></span>
        </div>
        <div class="overflow-hidden">
          <p class="text-xs font-bold text-white tracking-tight truncate">{{ authService.currentUser()?.name || 'Elena Rostova' }}</p>
          <p class="text-[11px] text-slate-400 truncate">{{ authService.currentUser()?.headline || 'Talent Partner' }}</p>
        </div>
      </div>
      <button
        (click)="logout()"
        title="Sign Out"
        class="text-slate-400 hover:text-rose-400 p-1.5 rounded-lg hover:bg-slate-800 transition-colors shrink-0"
      >
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
      </button>
    </div>
  </div>
</aside>
