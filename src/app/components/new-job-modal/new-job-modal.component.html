<div
  *ngIf="recruitService.isNewJobModalOpen()"
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md animate-fadeIn"
>
  <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
    <!-- Header -->
    <div class="p-5 border-b border-slate-800 flex items-center justify-between bg-slate-900/60">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-indigo-500/20 text-indigo-400 flex items-center justify-center">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
        </div>
        <div>
          <h3 class="text-base font-bold text-white">Create New Job Post</h3>
          <p class="text-xs text-slate-400">Post an opening and enable automated AI candidate screening</p>
        </div>
      </div>
      <button
        (click)="recruitService.closeNewJobModal()"
        class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition-colors"
      >
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Form -->
    <form (ngSubmit)="submit()" class="p-6 space-y-4 overflow-y-auto text-xs">
      <div>
        <label class="block text-slate-300 font-semibold mb-1.5">Job Title</label>
        <input
          type="text"
          [(ngModel)]="title"
          name="title"
          placeholder="e.g. Lead AI Systems Architect"
          class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white text-xs focus:outline-none focus:border-indigo-500"
          required
        />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-slate-300 font-semibold mb-1.5">Department</label>
          <select
            [(ngModel)]="department"
            name="department"
            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white text-xs focus:outline-none focus:border-indigo-500"
          >
            <option value="AI & Research Lab">AI & Research Lab</option>
            <option value="Platform Engineering">Platform Engineering</option>
            <option value="Core Product AI">Core Product AI</option>
            <option value="Design & UX">Design & UX</option>
            <option value="DevOps & Site Reliability">DevOps & Site Reliability</option>
          </select>
        </div>

        <div>
          <label class="block text-slate-300 font-semibold mb-1.5">Employment Type</label>
          <select
            [(ngModel)]="type"
            name="type"
            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white text-xs focus:outline-none focus:border-indigo-500"
          >
            <option value="Remote">Remote</option>
            <option value="Hybrid">Hybrid</option>
            <option value="Full-time">Full-time (On-site)</option>
            <option value="Contract">Contract</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-slate-300 font-semibold mb-1.5">Location</label>
          <input
            type="text"
            [(ngModel)]="location"
            name="location"
            placeholder="e.g. San Francisco, CA / Remote"
            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white text-xs focus:outline-none focus:border-indigo-500"
            required
          />
        </div>

        <div>
          <label class="block text-slate-300 font-semibold mb-1.5">Salary Range</label>
          <input
            type="text"
            [(ngModel)]="salaryRange"
            name="salaryRange"
            placeholder="e.g. $190k - $240k"
            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white text-xs focus:outline-none focus:border-indigo-500"
          />
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-slate-300 font-semibold mb-1.5">Experience Required</label>
          <input
            type="text"
            [(ngModel)]="experienceRequired"
            name="experienceRequired"
            placeholder="e.g. 6+ years"
            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white text-xs focus:outline-none focus:border-indigo-500"
          />
        </div>

        <div>
          <label class="block text-slate-300 font-semibold mb-1.5">Priority Status</label>
          <select
            [(ngModel)]="status"
            name="status"
            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white text-xs focus:outline-none focus:border-indigo-500"
          >
            <option value="Active">Active</option>
            <option value="Urgent">Urgent Priority</option>
            <option value="Draft">Draft</option>
          </select>
        </div>
      </div>

      <!-- AI Auto-Source Toggle -->
      <div class="p-3 bg-indigo-950/30 border border-indigo-500/20 rounded-xl flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
          <div>
            <p class="text-xs font-semibold text-white">AI Instant Sourcing</p>
            <p class="text-[10px] text-slate-400">Automatically discover & score top matching candidates</p>
          </div>
        </div>
        <span class="text-xs font-bold text-indigo-400">Enabled</span>
      </div>

      <!-- Actions -->
      <div class="pt-4 border-t border-slate-800 flex items-center justify-end gap-2.5">
        <button
          type="button"
          (click)="recruitService.closeNewJobModal()"
          class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium text-xs transition-colors"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs shadow-md shadow-indigo-600/30 transition-all"
        >
          Publish Job Post
        </button>
      </div>
    </form>
  </div>
</div>
